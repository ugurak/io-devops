# api + web: iç ağ (DB/MinIO) + veraius-proxy (nginx-proxy keşfi / TLS)
networks:
  istanbulofset-proxy:
    external: true
    name: istanbulofset-proxy
  veraius-proxy:
    external: true
    name: veraius-proxy

services:
  api:
    image: ${DOCKER_REGISTRY:-registry.veraius.com}/istanbulofset-api:${IMAGE_TAG:-latest}
    container_name: istanbulofset-api
    hostname: api
    restart: unless-stopped
    pull_policy: always
    expose:
      - "8080"
    environment:
      ConnectionStrings__Default: Host=postgres;Database=${POSTGRES_DB:-istanbulofset};Username=${POSTGRES_USER:-istanbulofset};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      Database__MigrateOnStartup: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY gerekli (en az 32 karakter)}
      Web__BaseUrl: https://${SITE_DOMAIN}
      Cors__Origins__0: https://${SITE_DOMAIN}
      Proxy__KnownNetworks__0: 172.16.0.0/12
      Integrations__Payment: ${PAYMENT_PROVIDER:-iyzico}
      Integrations__Cargo: ${CARGO_PROVIDER:-manual}
      Integrations__EInvoice: ${EINVOICE_PROVIDER:-manual}
      Cargo__Company: ${CARGO_COMPANY:-Yurtiçi Kargo}
      Email__Host: ${SMTP_HOST:?SMTP_HOST gerekli}
      Email__Port: ${SMTP_PORT:-587}
      Email__User: ${SMTP_USER:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__Security: ${SMTP_SECURITY:-StartTls}
      Email__From: ${SMTP_FROM:-İstanbul Ofset <siparis@istanbulofset.net>}
      Iyzico__BaseUrl: ${IYZICO_BASE_URL:-https://api.iyzipay.com}
      Iyzico__ApiKey: ${IYZICO_API_KEY:-}
      Iyzico__SecretKey: ${IYZICO_SECRET_KEY:-}
      Iyzico__CallbackBaseUrl: https://${API_DOMAIN}
      Security__RequireStaffMfa: "true"
      Seed__AdminEmail: ${ADMIN_EMAIL:-}
      Seed__AdminPassword: ${ADMIN_INITIAL_PASSWORD:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      Storage__Provider: Minio
      Storage__Minio__Endpoint: minio:9000
      Storage__Minio__AccessKey: ${MINIO_ROOT_USER}
      Storage__Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
      Storage__Minio__Bucket: ${MINIO_BUCKET:-istanbulofset-uploads}
      Storage__Minio__UseSsl: "false"
      Logging__Logstash__Url: http://logstash:8080
      TZ: Europe/Istanbul
      # nginx-proxy (veraius devops)
      VIRTUAL_HOST: ${API_DOMAIN:?API_DOMAIN gerekli}
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: ${API_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@istanbulofset.net}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      - "com.istanbulofset.stack=true"
      - "com.istanbulofset.service=api"
      - "com.istanbulofset.maintainer=devops"
    security_opt:
      - no-new-privileges:true
    networks:
      istanbulofset-proxy:
        aliases: [api]
      veraius-proxy:

  web:
    image: ${DOCKER_REGISTRY:-registry.veraius.com}/istanbulofset-web:${IMAGE_TAG:-latest}
    container_name: istanbulofset-web
    hostname: web
    restart: unless-stopped
    pull_policy: always
    depends_on:
      - api
    expose:
      - "3000"
    environment:
      API_URL: http://api:8080
      NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      ALLOW_AI_TRAINING: ${ALLOW_AI_TRAINING:-true}
      TZ: Europe/Istanbul
      # www yalnızca DNS A kaydı varsa ekle (yoksa LE çoklu SAN siparişi düşer)
      VIRTUAL_HOST: ${SITE_DOMAIN:?SITE_DOMAIN gerekli}${SITE_WWW_HOST:+,${SITE_WWW_HOST}}
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: ${SITE_DOMAIN}${SITE_WWW_HOST:+,${SITE_WWW_HOST}}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@istanbulofset.net}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M
    labels:
      - "com.istanbulofset.stack=true"
      - "com.istanbulofset.service=web"
      - "com.istanbulofset.maintainer=devops"
    security_opt:
      - no-new-privileges:true
    networks:
      istanbulofset-proxy:
        aliases: [web]
      veraius-proxy:
