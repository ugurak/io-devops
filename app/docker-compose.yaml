# api + web: iç ağ (DB/MinIO) + veraius-proxy (nginx-proxy keşfi / TLS)
networks:
  istanbulofset-proxy:
    external: true
    name: istanbulofset-proxy
  veraius-proxy:
    external: true
    name: veraius-proxy

services:
  api:
    image: ${DOCKER_REGISTRY:-registry.veraius.com}/istanbulofset-api:${IMAGE_TAG:-latest}
    container_name: istanbulofset-api
    # Konteyner günlükleri en fazla 3×10 MB (varsayılan json-file sınırsız büyür, disk dolar).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    hostname: api
    restart: unless-stopped
    pull_policy: always
    expose:
      - "8080"
    # Runtime imajında curl yok: bash /dev/tcp ile /live.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /live HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q \" 200\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      ConnectionStrings__Default: Host=postgres;Database=${POSTGRES_DB:-istanbulofset};Username=${POSTGRES_USER:-istanbulofset};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      Database__MigrateOnStartup: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY gerekli (en az 32 karakter)}
      Web__BaseUrl: https://${SITE_DOMAIN}
      # Host başlığı süzgeci: yalnızca genel API adı ve iç ağ adları (Gatus/web → api:8080, healthcheck → 127.0.0.1).
      AllowedHosts: "${API_DOMAIN};api;localhost;127.0.0.1"
      Cors__Origins__0: https://${SITE_DOMAIN}
      Proxy__KnownNetworks__0: 172.16.0.0/12
      Integrations__Payment: ${PAYMENT_PROVIDER:-iyzico}
      Integrations__Cargo: ${CARGO_PROVIDER:-manual}
      Integrations__EInvoice: ${EINVOICE_PROVIDER:-manual}
      Cargo__Company: ${CARGO_COMPANY:-Yurtiçi Kargo}
      # Yurtiçi Kargo web servisi (CARGO_PROVIDER=yurtici). Boş adres = test ortamı.
      YurticiKargo__Username: ${YURTICI_USERNAME:-}
      YurticiKargo__Password: ${YURTICI_PASSWORD:-}
      YurticiKargo__BaseUrl: ${YURTICI_BASE_URL:-}
      Email__Host: ${SMTP_HOST:?SMTP_HOST gerekli}
      Email__Port: ${SMTP_PORT:-587}
      Email__User: ${SMTP_USER:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__Security: ${SMTP_SECURITY:-StartTls}
      Email__From: ${SMTP_FROM:-İstanbul Ofset <siparis@istanbulofset.net>}
      # Müşteri yanıtları bu adrese gider (boşsa gönderen adres; kurumsal destek kutusu önerilir).
      Email__ReplyTo: ${SMTP_REPLY_TO:-}
      Iyzico__BaseUrl: ${IYZICO_BASE_URL:-https://api.iyzipay.com}
      Iyzico__ApiKey: ${IYZICO_API_KEY:-}
      Iyzico__SecretKey: ${IYZICO_SECRET_KEY:-}
      Iyzico__CallbackBaseUrl: https://${API_DOMAIN}
      # false = geçici erteleme (MFA kurulana kadar yönetim paneli açılsın)
      Security__RequireStaffMfa: "${REQUIRE_STAFF_MFA:-false}"
      Seed__AdminEmail: ${ADMIN_EMAIL:-}
      Seed__AdminPassword: ${ADMIN_INITIAL_PASSWORD:-}
      # _lib.sh EXTRA_STACKS'e göre doldurur (observability / glitchtip / clamav); boşsa özellik kapalı.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      Sentry__Dsn: ${SENTRY_DSN_API:-}
      Uploads__ClamAv: ${CLAMAV_ADDRESS:-}
      Uploads__ArtworkRetentionDays: ${ARTWORK_RETENTION_DAYS:-365}
      Storage__Provider: Minio
      Storage__Minio__Endpoint: minio:9000
      # Kısıtlı uygulama kullanıcısı (minio/minio-setup.sh); tanımlı değilse root ile devam eder.
      Storage__Minio__AccessKey: ${MINIO_APP_USER:-${MINIO_ROOT_USER}}
      Storage__Minio__SecretKey: ${MINIO_APP_PASSWORD:-${MINIO_ROOT_PASSWORD}}
      Storage__Minio__Bucket: ${MINIO_BUCKET:-istanbulofset-uploads}
      Storage__Minio__UseSsl: "false"
      Logging__Logstash__Url: http://logstash:8080
      WebPush__PublicKey: ${WEBPUSH_PUBLIC_KEY:-}
      WebPush__PrivateKey: ${WEBPUSH_PRIVATE_KEY:-}
      WebPush__Subject: ${WEBPUSH_SUBJECT:-mailto:destek@istanbulofset.net}
      TZ: Europe/Istanbul
      # nginx-proxy (veraius devops)
      VIRTUAL_HOST: ${API_DOMAIN:?API_DOMAIN gerekli}
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: ${API_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@istanbulofset.net}
    deploy:
      resources:
        # host bütçe ~8 CPU / 16G — api ağır
        limits:
          cpus: "2.0"
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 512M
    labels:
      - "com.istanbulofset.stack=true"
      - "com.istanbulofset.service=api"
      - "com.istanbulofset.maintainer=devops"
    security_opt:
      - no-new-privileges:true
    networks:
      istanbulofset-proxy:
        aliases: [api]
      veraius-proxy:

  web:
    image: ${DOCKER_REGISTRY:-registry.veraius.com}/istanbulofset-web:${IMAGE_TAG:-latest}
    container_name: istanbulofset-web
    # Konteyner günlükleri en fazla 3×10 MB (varsayılan json-file sınırsız büyür, disk dolar).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    hostname: web
    restart: unless-stopped
    pull_policy: always
    # API hazır olmadan açılırsa ilk istekler yedek katalogla döner; sağlıklı olmasını bekle.
    depends_on:
      api: { condition: service_healthy }
    expose:
      - "3000"
    environment:
      API_URL: http://api:8080
      NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      ALLOW_AI_TRAINING: ${ALLOW_AI_TRAINING:-true}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${WEBPUSH_PUBLIC_KEY:-}
      # Site araması (Türkçe kök, yazım hatası toleransı); Elasticsearch yoksa yerel aramaya düşer.
      ELASTICSEARCH_URL: http://elasticsearch:9200
      # Yalnızca istanbulofset-site* dizinlerine yetkili kullanıcı (elk/elastic-setup.sh oluşturur).
      ELASTICSEARCH_USERNAME: istanbulofset_web
      ELASTICSEARCH_PASSWORD: ${SEARCH_ES_PASSWORD:-${ELASTIC_PASSWORD}}
      # Sunucu ve tarayıcı hataları GlitchTip'e (kişisel veri gönderilmez).
      SENTRY_DSN: ${SENTRY_DSN_WEB:-}
      TZ: Europe/Istanbul
      # www yalnızca DNS A kaydı varsa ekle (yoksa LE çoklu SAN siparişi düşer)
      VIRTUAL_HOST: ${SITE_DOMAIN:?SITE_DOMAIN gerekli}${SITE_WWW_HOST:+,${SITE_WWW_HOST}}
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: ${SITE_DOMAIN}${SITE_WWW_HOST:+,${SITE_WWW_HOST}}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@istanbulofset.net}
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M
    labels:
      - "com.istanbulofset.stack=true"
      - "com.istanbulofset.service=web"
      - "com.istanbulofset.maintainer=devops"
    security_opt:
      - no-new-privileges:true
    networks:
      istanbulofset-proxy:
        aliases: [web]
      veraius-proxy:
