networks:
  istanbulofset-proxy:
    external: true
    name: istanbulofset-proxy

services:
  backup:
    image: postgres:17-alpine
    container_name: istanbulofset-backup
    # Konteyner günlükleri en fazla 3×10 MB (varsayılan json-file sınırsız büyür, disk dolar).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    hostname: backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-istanbulofset}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      PGDATABASE: ${POSTGRES_DB:-istanbulofset}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Gatus yedek sinyali (monitoring/gatus.yaml → yedekleme_veritabani): başarısızlık / 26 saat sessizlik → e-posta.
      BACKUP_HEARTBEAT_URL: http://gatus:8080/api/v1/endpoints/yedekleme_veritabani/external
      DISK_HEARTBEAT_URL: http://gatus:8080/api/v1/endpoints/sunucu_disk/external
      RESTORE_HEARTBEAT_URL: http://gatus:8080/api/v1/endpoints/yedekleme_geriyukleme/external
      DISK_ALERT_PERCENT: ${DISK_ALERT_PERCENT:-85}
      BACKUP_HEARTBEAT_TOKEN: ${BACKUP_HEARTBEAT_TOKEN:-${POSTGRES_PASSWORD}}
      TZ: Europe/Istanbul
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "-c", "while true; do /bin/sh /backup.sh; sleep 86400; done"]
    labels:
      - "com.istanbulofset.stack=true"
      - "com.istanbulofset.service=backup"
      - "com.istanbulofset.config-hash=${STACK_CONFIG_HASH:-}"
      - "com.istanbulofset.maintainer=devops"
    security_opt:
      - no-new-privileges:true
    networks:
      - istanbulofset-proxy

  # Sunucu dışı şifreli kopya: pg_dump yedekleri + MinIO medyası (offsite.sh). OFFSITE_S3_BUCKET boşsa yalnızca uyarır.
  # pg_dump'tan ~1 saat sonra başlar, sonra günde bir. Elle: docker exec istanbulofset-offsite sh /offsite.sh [list|fetch-db <dosya>|restore-media]
  offsite:
    image: rclone/rclone:1.71.2
    container_name: istanbulofset-offsite
    # Konteyner günlükleri en fazla 3×10 MB (varsayılan json-file sınırsız büyür, disk dolar).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    hostname: offsite
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER gerekli}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD gerekli}
      MINIO_BUCKET: ${MINIO_BUCKET:-istanbulofset-uploads}
      OFFSITE_S3_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}
      OFFSITE_S3_BUCKET: ${OFFSITE_S3_BUCKET:-}
      OFFSITE_S3_ACCESS_KEY: ${OFFSITE_S3_ACCESS_KEY:-}
      OFFSITE_S3_SECRET_KEY: ${OFFSITE_S3_SECRET_KEY:-}
      OFFSITE_S3_REGION: ${OFFSITE_S3_REGION:-auto}
      OFFSITE_S3_PROVIDER: ${OFFSITE_S3_PROVIDER:-Other}
      OFFSITE_ENCRYPTION_PASSWORD: ${OFFSITE_ENCRYPTION_PASSWORD:-}
      # Google Drive hedefi (ücretsiz): rclone authorize çıktısı. Verilirse S3 yerine Drive kullanılır.
      OFFSITE_DRIVE_TOKEN: ${OFFSITE_DRIVE_TOKEN:-}
      OFFSITE_DRIVE_FOLDER: ${OFFSITE_DRIVE_FOLDER:-istanbulofset-yedek}
      OFFSITE_RETENTION_DAYS: ${OFFSITE_RETENTION_DAYS:-30}
      OFFSITE_HEARTBEAT_URL: ${OFFSITE_HEARTBEAT_URL:-}
      GATUS_OFFSITE_URL: http://gatus:8080/api/v1/endpoints/yedekleme_offsite/external
      BACKUP_HEARTBEAT_TOKEN: ${BACKUP_HEARTBEAT_TOKEN:-${POSTGRES_PASSWORD}}
      TZ: Europe/Istanbul
    volumes:
      - ./offsite.sh:/offsite.sh:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "-c", "sleep 3600; while true; do /bin/sh /offsite.sh || echo '[offsite] HATA: sunucu dışı yedek başarısız'; sleep 86400; done"]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    labels:
      - "com.istanbulofset.stack=true"
      - "com.istanbulofset.service=offsite"
      - "com.istanbulofset.config-hash=${STACK_CONFIG_HASH:-}"
      - "com.istanbulofset.maintainer=devops"
    security_opt:
      - no-new-privileges:true
    networks:
      - istanbulofset-proxy

volumes:
  backups:
    name: istanbulofset_backups
    labels:
      - "com.istanbulofset.volume=backups"
      - "com.istanbulofset.backup=true"
