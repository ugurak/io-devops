networks:
  istanbulofset-proxy:
    external: true
    name: istanbulofset-proxy

services:
  postgres:
    image: postgres:17-alpine
    container_name: istanbulofset-postgres
    # Konteyner günlükleri en fazla 3×10 MB (varsayılan json-file sınırsız büyür, disk dolar).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    hostname: postgres
    restart: unless-stopped
    # 4 GB sınırına göre ayar (varsayılanlar 128 MB önbellek / 100 bağlantı). Değerler .env'den değiştirilebilir.
    # API havuzu en çok 50 bağlantı açar (ConnectionStrings: Maximum Pool Size); GlitchTip ve yedek için pay kalır.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1280MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3584MB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-150}
      - -c
      - random_page_cost=1.1
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=${PG_SLOW_QUERY_MS:-1000}
    shm_size: 1g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-istanbulofset}
      POSTGRES_USER: ${POSTGRES_USER:-istanbulofset}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      TZ: Europe/Istanbul
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
    labels:
      - "com.istanbulofset.stack=true"
      - "com.istanbulofset.service=postgres"
      - "com.istanbulofset.maintainer=devops"
    security_opt:
      - no-new-privileges:true
    networks:
      istanbulofset-proxy:
        aliases: [postgres]

volumes:
  pgdata:
    name: istanbulofset_pgdata
    labels:
      - "com.istanbulofset.volume=postgres"
      - "com.istanbulofset.backup=true"
      - "com.istanbulofset.critical=true"
