networks:
  istanbulofset-proxy:
    external: true
    name: istanbulofset-proxy

services:
  redis:
    image: redis:7-alpine
    container_name: istanbulofset-redis
    hostname: redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD gerekli}
      - --appendonly
      - "yes"
      - --loglevel
      - warning
    environment:
      TZ: Europe/Istanbul
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M
    labels:
      - "com.istanbulofset.stack=true"
      - "com.istanbulofset.service=redis"
      - "com.istanbulofset.maintainer=devops"
    security_opt:
      - no-new-privileges:true
    networks:
      istanbulofset-proxy:
        aliases: [redis]

volumes:
  redisdata:
    name: istanbulofset_redisdata
    labels:
      - "com.istanbulofset.volume=redis"
