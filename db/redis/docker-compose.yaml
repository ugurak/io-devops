networks:
  istanbulofset-proxy:
    external: true
    name: istanbulofset-proxy

services:
  redis:
    image: redis:7-alpine
    container_name: istanbulofset-redis
    # Konteyner günlükleri en fazla 3×10 MB (varsayılan json-file sınırsız büyür, disk dolar).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    hostname: redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD gerekli}
      - --appendonly
      - "yes"
      # Bellek sınırı (konteyner 1 GB): yalnızca süreli anahtarlar (önbellek, istek sınırı) atılır;
      # süresiz e-posta kuyruğu (io:email) korunur. Sınırsızken OOM ile tüm Redis düşerdi.
      - --maxmemory
      - ${REDIS_MAXMEMORY:-768mb}
      - --maxmemory-policy
      - volatile-lru
      - --loglevel
      - warning
    environment:
      TZ: Europe/Istanbul
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M
    labels:
      - "com.istanbulofset.stack=true"
      - "com.istanbulofset.service=redis"
      - "com.istanbulofset.maintainer=devops"
    security_opt:
      - no-new-privileges:true
    networks:
      istanbulofset-proxy:
        aliases: [redis]

volumes:
  redisdata:
    name: istanbulofset_redisdata
    labels:
      - "com.istanbulofset.volume=redis"
