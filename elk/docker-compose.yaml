networks:
  istanbulofset-proxy:
    external: true
    name: istanbulofset-proxy

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: istanbulofset-elasticsearch
    # Konteyner günlükleri en fazla 3×10 MB (varsayılan json-file sınırsız büyür, disk dolar).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    hostname: elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD gerekli}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
      TZ: Europe/Istanbul
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200 >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 768M
    labels:
      - "com.istanbulofset.stack=true"
      - "com.istanbulofset.service=elasticsearch"
      - "com.istanbulofset.maintainer=devops"
    security_opt:
      - no-new-privileges:true
    networks:
      istanbulofset-proxy:
        aliases: [elasticsearch]

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: istanbulofset-logstash
    # Konteyner günlükleri en fazla 3×10 MB (varsayılan json-file sınırsız büyür, disk dolar).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    hostname: logstash
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
      elastic-setup:
        condition: service_completed_successfully
    volumes:
      - ./logstash/pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      # Yalnızca istanbulofset-logs-* dizinlerine yazabilen kullanıcı (elastic-setup oluşturur).
      ELASTIC_USER: istanbulofset_logstash
      ELASTIC_PASSWORD: ${LOGSTASH_ES_PASSWORD:-${ELASTIC_PASSWORD}}
      TZ: Europe/Istanbul
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M
    labels:
      - "com.istanbulofset.stack=true"
      - "com.istanbulofset.service=logstash"
      - "com.istanbulofset.maintainer=devops"
    security_opt:
      - no-new-privileges:true
    networks:
      istanbulofset-proxy:
        aliases: [logstash]

  # Kibana 8 "elastic" süper kullanıcısıyla açılmaz (FATAL): kibana_system şifresi ve web/logstash'in kısıtlı kullanıcıları burada hazırlanır.
  elastic-setup:
    image: curlimages/curl:8.10.1
    container_name: istanbulofset-elastic-setup
    # Konteyner günlükleri en fazla 3×10 MB (varsayılan json-file sınırsız büyür, disk dolar).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:-${ELASTIC_PASSWORD}}
      SEARCH_ES_PASSWORD: ${SEARCH_ES_PASSWORD:-${ELASTIC_PASSWORD}}
      LOGSTASH_ES_PASSWORD: ${LOGSTASH_ES_PASSWORD:-${ELASTIC_PASSWORD}}
      MONITOR_ES_PASSWORD: ${MONITOR_ES_PASSWORD:-${ELASTIC_PASSWORD}}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
    volumes:
      - ./elastic-setup.sh:/elastic-setup.sh:ro
    entrypoint: ["/bin/sh", "/elastic-setup.sh"]
    labels:
      - "com.istanbulofset.stack=true"
      - "com.istanbulofset.service=elastic-setup"
      - "com.istanbulofset.maintainer=devops"
    security_opt:
      - no-new-privileges:true
    networks: [istanbulofset-proxy]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: istanbulofset-kibana
    # Konteyner günlükleri en fazla 3×10 MB (varsayılan json-file sınırsız büyür, disk dolar).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    hostname: kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
      elastic-setup:
        condition: service_completed_successfully
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:-${ELASTIC_PASSWORD}}
      TELEMETRY_OPTIN: "false"
      TELEMETRY_ALLOWCHANGINGOPTINSTATUS: "false"
      TZ: Europe/Istanbul
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M
    labels:
      - "com.istanbulofset.stack=true"
      - "com.istanbulofset.service=kibana"
      - "com.istanbulofset.maintainer=devops"
    security_opt:
      - no-new-privileges:true
    networks:
      istanbulofset-proxy:
        aliases: [kibana]

  # Hazır "API logları" panosu, kayıtlı aramalar ve grafikler (elk/kibana). Kibana'ya elastic kullanıcısıyla girilir.
  kibana-setup:
    image: curlimages/curl:8.10.1
    container_name: istanbulofset-kibana-setup
    # Konteyner günlükleri en fazla 3×10 MB (varsayılan json-file sınırsız büyür, disk dolar).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on: [kibana]
    environment:
      KIBANA_URL: http://kibana:5601
      KIBANA_USER: elastic
      KIBANA_PASSWORD: ${ELASTIC_PASSWORD}
      JAEGER_URL: ${JAEGER_PUBLIC_URL:-}
    volumes:
      - ./kibana:/setup:ro
    entrypoint: ["/bin/sh", "/setup/setup.sh"]
    restart: on-failure
    labels:
      - "com.istanbulofset.stack=true"
      - "com.istanbulofset.service=kibana-setup"
      - "com.istanbulofset.maintainer=devops"
    security_opt:
      - no-new-privileges:true
    networks: [istanbulofset-proxy]

volumes:
  esdata:
    name: istanbulofset_esdata
    labels:
      - "com.istanbulofset.volume=elasticsearch"
