input {
  http {
    port => 8080
    codec => json
  }
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  # logs-* Elastic'in data stream şablonuna yakalanır; özel önek kullan.
  mutate {
    add_field => { "[@metadata][target_index]" => "istanbulofset-logs-%{+YYYY.MM.dd}" }
  }
  if ![service] {
    mutate { add_field => { "service" => "istanbulofset-api" } }
  }
  if [Properties][CorrelationId] {
    mutate { rename => { "[Properties][CorrelationId]" => "correlationId" } }
  }
  if [CorrelationId] {
    mutate { rename => { "CorrelationId" => "correlationId" } }
  }
  # Serilog kompakt biçimi Information düzeyini yazmaz (@l yok); Kibana'da filtrelemek için her kayda "level".
  if [@l] {
    mutate { copy => { "@l" => "level" } }
  } else {
    mutate { add_field => { "level" => "Information" } }
  }
  if [@tr] {
    mutate { copy => { "@tr" => "trace_id" } }
  }
  # Şablondan (@mt) okunur ileti: "HTTP {RequestMethod} {RequestPath} …" → "HTTP GET /api/v1/… …"
  if [@mt] and ![message] {
    ruby {
      code => "mt = event.get('@mt'); event.set('message', mt.gsub(/\{@?([A-Za-z0-9_]+)(?::[^}]*)?\}/) { v = event.get($1); v.nil? ? $& : (v.is_a?(String) ? v : v.to_s) })"
    }
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
    index => "%{[@metadata][target_index]}"
    user => "${ELASTIC_USER:}"
    password => "${ELASTIC_PASSWORD:}"
  }
}
