networks:
  istanbulofset-proxy:
    external: true
    name: istanbulofset-proxy

services:
  # Bucket API ilk yazımda oluşturulur (S3FileStorage.EnsureBucket).
  minio:
    # Sürüme sabit: "latest" habersiz güncellenip veri biçimini değiştirebilir (yükseltme bilinçli yapılır).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: istanbulofset-minio
    hostname: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER gerekli}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD gerekli}
      TZ: Europe/Istanbul
    volumes:
      - miniodata:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M
    labels:
      - "com.istanbulofset.stack=true"
      - "com.istanbulofset.service=minio"
      - "com.istanbulofset.maintainer=devops"
    security_opt:
      - no-new-privileges:true
    networks:
      istanbulofset-proxy:
        aliases: [minio]

  # API'nin kısıtlı kullanıcısı (minio-setup.sh): yalnızca MINIO_BUCKET'a okuma/yazma. Root yalnızca yönetim için kalır.
  # Aynı imajdaki mc kullanılır (ayrı imaj çekilmez). Her deploy'da güvenle tekrar çalışır.
  minio-setup:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: istanbulofset-minio-setup
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER gerekli}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD gerekli}
      MINIO_BUCKET: ${MINIO_BUCKET:-istanbulofset-uploads}
      MINIO_APP_USER: ${MINIO_APP_USER:-}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:-}
    volumes:
      - ./minio-setup.sh:/minio-setup.sh:ro
    entrypoint: ["/bin/sh", "/minio-setup.sh"]
    restart: "no"
    labels:
      - "com.istanbulofset.stack=true"
      - "com.istanbulofset.service=minio-setup"
      - "com.istanbulofset.maintainer=devops"
    security_opt:
      - no-new-privileges:true
    networks:
      - istanbulofset-proxy

volumes:
  miniodata:
    name: istanbulofset_miniodata
    labels:
      - "com.istanbulofset.volume=minio"
      - "com.istanbulofset.backup=true"
      - "com.istanbulofset.critical=true"
