# Çalışma süresi izleme (Gatus, monitoring/gatus.yaml): site, arama, site haritası, Merchant feed, API live/ready,
# katalog, ödeme dönüş adresi ve SSL süresi. 3 başarısızlıkta ALERT_EMAIL'e (boşsa ADMIN_EMAIL) e-posta, düzelince
# "çözüldü" e-postası. SMTP_HOST gerçek bir sunucu olmalı. Sunucunun kendisi çökerse bu da çöker: dışarıdan ek bir
# izleme önerilir. Panel dışarı açılmaz (konteyner içi 8080; SSH tüneliyle bakılır).
networks:
  istanbulofset-proxy:
    external: true
    name: istanbulofset-proxy

services:
  gatus:
    image: twinproduction/gatus:v5.17.0
    container_name: istanbulofset-gatus
    hostname: gatus
    restart: unless-stopped
    environment:
      SITE_URL: https://${SITE_DOMAIN}
      API_URL: https://${API_DOMAIN}
      # /ready ve /health dışarıya kapalı (nginx vhost.d → 404); iç ağdan doğrudan denetlenir.
      API_INTERNAL_URL: http://api:8080
      # Yedek sinyali belirteci (backup/docker-compose.yaml ile aynı).
      BACKUP_HEARTBEAT_TOKEN: ${BACKUP_HEARTBEAT_TOKEN:-${POSTGRES_PASSWORD}}
      TLS_CHECKS: "true"
      ALERT_EMAIL: ${ALERT_EMAIL:-${ADMIN_EMAIL:-}}
      ALERT_FROM: ${ALERT_FROM:-izleme@${SITE_DOMAIN}}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_INSECURE: "false"
      TZ: Europe/Istanbul
    volumes:
      - ./gatus.yaml:/config/config.yaml:ro
      - gatusdata:/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    labels:
      - "com.istanbulofset.stack=true"
      - "com.istanbulofset.service=gatus"
      - "com.istanbulofset.maintainer=devops"
    security_opt:
      - no-new-privileges:true
    networks:
      istanbulofset-proxy:
        aliases: [gatus]

volumes:
  gatusdata:
    name: istanbulofset_gatusdata
    labels:
      - "com.istanbulofset.volume=gatus"
