# Metrik ve iz altyapısı. İsteğe bağlı: EXTRA_STACKS içinde "observability" (_lib.sh API'ye
# OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317 verir). API → Collector → izler Jaeger'a, metrikler Prometheus'a;
# Grafana'da hazır "API" panosu. Arayüzler dışarı açılmaz (SSH tüneli: Grafana 3000, Jaeger 16686).
networks:
  istanbulofset-proxy:
    external: true
    name: istanbulofset-proxy

x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  otel-collector:
    <<: *common
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: istanbulofset-otel-collector
    # Konteyner günlükleri en fazla 3×10 MB (varsayılan json-file sınırsız büyür, disk dolar).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    hostname: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [jaeger]
    environment:
      TZ: Europe/Istanbul
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }
        reservations: { cpus: "0.05", memory: 64M }
    labels:
      - "com.istanbulofset.stack=true"
      - "com.istanbulofset.service=otel-collector"
      - "com.istanbulofset.config-hash=${STACK_CONFIG_HASH:-}"
      - "com.istanbulofset.maintainer=devops"
    networks:
      istanbulofset-proxy:
        aliases: [otel-collector]

  jaeger:
    <<: *common
    image: jaegertracing/all-in-one:1.62.0
    container_name: istanbulofset-jaeger
    # Konteyner günlükleri en fazla 3×10 MB (varsayılan json-file sınırsız büyür, disk dolar).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    hostname: jaeger
    command: ["--memory.max-traces=20000"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      TZ: Europe/Istanbul
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 384M }
        reservations: { cpus: "0.05", memory: 64M }
    labels:
      - "com.istanbulofset.stack=true"
      - "com.istanbulofset.service=jaeger"
      - "com.istanbulofset.maintainer=devops"
    networks:
      istanbulofset-proxy:
        aliases: [jaeger]

  prometheus:
    <<: *common
    image: prom/prometheus:v2.55.1
    container_name: istanbulofset-prometheus
    # Konteyner günlükleri en fazla 3×10 MB (varsayılan json-file sınırsız büyür, disk dolar).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    hostname: prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    environment:
      TZ: Europe/Istanbul
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 384M }
        reservations: { cpus: "0.05", memory: 64M }
    labels:
      - "com.istanbulofset.stack=true"
      - "com.istanbulofset.service=prometheus"
      - "com.istanbulofset.config-hash=${STACK_CONFIG_HASH:-}"
      - "com.istanbulofset.maintainer=devops"
    networks:
      istanbulofset-proxy:
        aliases: [prometheus]

  grafana:
    <<: *common
    image: grafana/grafana:11.3.0
    container_name: istanbulofset-grafana
    # Konteyner günlükleri en fazla 3×10 MB (varsayılan json-file sınırsız büyür, disk dolar).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    hostname: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/api.json
      TZ: Europe/Istanbul
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus]
    # Şifre boşsa Grafana "admin" kabul ederdi; compose'da zorunlu tutulmaz ki yığın kapalıyken deploy durmasın.
    entrypoint: ["/bin/sh", "-c", "[ -n \"$$GF_SECURITY_ADMIN_PASSWORD\" ] || { echo 'GRAFANA_ADMIN_PASSWORD gerekli'; exit 1; }; exec /run.sh"]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }
        reservations: { cpus: "0.05", memory: 64M }
    labels:
      - "com.istanbulofset.stack=true"
      - "com.istanbulofset.service=grafana"
      - "com.istanbulofset.maintainer=devops"
    networks:
      istanbulofset-proxy:
        aliases: [grafana]

volumes:
  promdata:
    name: istanbulofset_promdata
    labels:
      - "com.istanbulofset.volume=prometheus"
  grafanadata:
    name: istanbulofset_grafanadata
    labels:
      - "com.istanbulofset.volume=grafana"
