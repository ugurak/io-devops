# API'den gelen OpenTelemetry verisini dağıtır: izler → Jaeger, metrikler → Prometheus (:8889 üzerinden çekilir).
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: { insecure: true }
  prometheus:
    endpoint: 0.0.0.0:8889
    # service.name vb. kaynak bilgileri metrik etiketi olur (job="istanbulofset-api").
    resource_to_telemetry_conversion: { enabled: true }

service:
  pipelines:
    traces: { receivers: [otlp], processors: [batch], exporters: [otlp/jaeger] }
    metrics: { receivers: [otlp], processors: [batch], exporters: [prometheus] }
